:root.dark {

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }

.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.mockbar b { font-weight: 700; }
.mockbar .seg { display: inline-flex; border: 1px solid #50567a; border-radius: 8px; overflow: hidden; }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--s300); background: var(--surface); }

.link { color: var(--b700); cursor: pointer; background: none; border: 0; padding: 0; }

.muted { color: var(--s500); }
.kbd { display: inline-block; border: 1px solid var(--s300); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11px; color: var(--s500); background: var(--surface); }
.page { max-width: 72rem; margin: 0 auto; }
.page h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 14px; }
.card { background: var(--surface); border: 1px solid var(--s200); border-radius: 12px; box-shadow: var(--shadow-card); padding: 16px; }
.timer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; border: 1px solid var(--b300); background: var(--b50); color: var(--b900); border-radius: 8px; padding: 8px 12px; }
.timer b { font-variant-numeric: tabular-nums; }

.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
.filters label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--s600); }
.filters .chk { display: flex; align-items: center; gap: 4px; padding-bottom: 7px; font-size: 13.5px; }

.app { display: flex; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; width: 15rem; flex: none; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--s200); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.side .brand { padding: 6px 8px 0; }

.nav:hover { background: var(--s100); }
.nav.on { background: var(--b50); color: var(--b700); font-weight: 600; }

nav ul { list-style: none; margin: 0; padding: 0; }
.sec { margin-top: 4px; }
.sec-h { display: flex; width: 100%; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; padding: 6px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--s400); }
.sec-h:hover { color: var(--s700); background: var(--s50); }
.sec-h .chev { width: 14px; height: 14px; transition: transform .15s; }
.sec-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.sec-h .count { margin-left: auto; font-size: 11px; color: var(--s400); letter-spacing: 0; }
.sec ul { padding-left: 4px; }
.sep { border-top: 1px solid var(--s200); margin: 8px 0; }
.foot { margin-top: auto; border-top: 1px solid var(--s200); padding: 12px 8px 4px; display: grid; gap: 8px; font-size: 13.5px; }
.foot .row { display: flex; gap: 14px; align-items: center; }
main { flex: 1; min-width: 0; padding: 32px; }
.mobilebar { display: none; }
/* Admin hub: its own sub-navigation */
.hub { display: grid; grid-template-columns: 13rem 1fr; gap: 24px; max-width: 72rem; margin: 0 auto; }
.hub nav { position: sticky; top: 32px; align-self: start; }
.hub nav h2 { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--s400); margin: 0 0 6px 10px; }
.hub-grid { display: grid; align-items: start; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 12px; }
.hub-grid a.card { display: grid; gap: 4px; }
.hub-grid a.card:hover { border-color: var(--b300); }
.hub-grid h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; color: var(--b700); }
.hub .page { margin: 0; }
@media (max-width: 767px) {
  .app { display: block; }
  .mobilebar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--s200); }
  .side { display: none; position: static; width: auto; height: auto; border-right: 0; border-bottom: 1px solid var(--s200); }
  .side.open { display: flex; }
  main { padding: 16px; }
  .hub { grid-template-columns: 1fr; }
  .hub nav { position: static; }
}
</style>
</head>

const route = () => decodeURIComponent(location.hash.slice(1)) || "/tickets";
// The item for the current route: exact match first (children before parents), then longest prefix.
function current() {

}

  [10482, "Outlook keeps asking for a password after MFA reset", "Harbour Dental", "Critical", "Open", "Sam Ortiz", "breached"],
  [10481, "\"urgent pls call\" from unknown sender", null, "Normal", "New", null, "ok"],
  [10479, "New starter laptop for Priya Nair (starts Monday)", "Kestrel Logistics", "Normal", "New", null, "ok"],
  [10477, "Backup job failed: NAS-01 nightly", "Fernhill Accounting", "High", "Open", "Jo Becker", "at_risk"],
  [10474, "RMM alert: disk 92% full on FS-02", "Fernhill Accounting", "High", "Open", "Alex Chen", "at_risk"],
  [10471, "Second-floor printer shows offline", "Marlow & Finch Legal", "Low", "Waiting on customer", "Sam Ortiz", "paused"],
  [10468, "Firewall firmware update, after-hours window", "Kestrel Logistics", "Normal", "Open", "Alex Chen", "ok"],
  [10466, "Shared mailbox access for accounts@", "Harbour Dental", "Normal", "Open", "Jo Becker", "ok"],
  [10463, "Teams calls drop after 10 minutes on Wi-Fi", "Brightwater Clinic", "High", "Open", "Sam Ortiz", "ok"],
];
const SLA = { breached: "SLA breached", at_risk: "SLA at risk", ok: "SLA ok", paused: "SLA paused" };
const timerBar = () => AT.includes(role)
  ? `<div class="timer" role="status" aria-label="Running timer"><b>00:42:13</b><span><a class="link" href="#/tickets/10477" style="text-decoration:underline">#10477 Backup job failed: NAS-01 nightly</a> <span style="color:var(--b700)">&mdash; checking retention settings</span></span><span class="end"><button class="btn" type="button">Stop</button><button class="btn" type="button">Discard</button></span></div>`
  : "";
function ticketsPage() {
  const write = role !== "read_only" && role !== "billing";
  const rows = TICKETS.map(([n, s, o, p, st, a, sla]) => `<tr>
    ${write ? `<td style="width:32px"><input type="checkbox" aria-label="Select ticket ${n}"></td>` : ""}
    <td class="muted">${n}</td><td><a href="#/tickets/${n}">${esc(s)}</a></td>
    <td>${o ? esc(o) : '<b class="triage">Needs triage</b>'}</td><td>${p}</td><td>${st}</td>
    <td>${a ?? '<span style="color:var(--s400)">unassigned</span>'}</td><td><span class="pill ${sla}">${SLA[sla]}</span></td></tr>`).join("");
  return `<div class="page">${timerBar()}
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><h1 style="margin:0">Tickets</h1>${write ? '<button class="btn primary" type="button" style="margin-left:auto">New ticket</button>' : ""}</div>
    <div class="filters">
      <label class="f">Search subject or #<input class="input" style="width:14rem"></label>
      <label class="f">Status<select class="input"><option>Open</option><option>New</option><option>Waiting on customer</option></select></label>
      <label class="f">Queue<select class="input"><option>Any</option><option>Service desk</option><option>Projects</option><option>Alerts</option></select></label>
      <label class="f">Assignee<select class="input"><option>Anyone</option><option>Me</option><option>Unassigned</option></select></label>
      <label class="chk"><input type="checkbox" checked> Open only</label>
      <label class="chk"><input type="checkbox"> Needs triage</label>
    </div>
    <div class="tbl-wrap"><table class="t"><caption class="sr-only">Open tickets</caption><thead><tr>${write ? '<th><input type="checkbox" aria-label="Select all tickets"></th>' : ""}<th>#</th><th>Subject</th><th>Organization</th><th>Priority &#9660;</th><th>Status</th><th>Assignee</th><th>SLA due</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="margin-top:10px">Showing 9 of 143 open tickets.</p></div>`;
}
function placeholderPage(it) {
  return `<div class="page">${timerBar()}<h1>${esc(it.label)}</h1><div class="card placeholder">
    <p style="margin:0">This page keeps its current content. Only the navigation changes.</p>
    <p style="margin:0" class="muted">Route today: <code>${esc(route())}</code> &middot; Found under: <b>${esc(crumb(it))}</b></p>
    <p style="margin:0"><a class="link" href="#/tickets">Back to the ticket queue</a> to judge the navigation against real content.</p></div></div>`;
}
const pageFor = (it) => (route().startsWith("/tickets") ? ticketsPage() : placeholderPage(it));
const onCallWidget = () => `<section class="oncall" aria-label="On call now"><h2>On call</h2><span class="muted" style="display:block;font-size:12px">After-hours rotation</span><b>Alex Chen</b> <span class="muted" style="font-size:12px">until Mon 3 Nov 08:00</span></section>`;

// ---- Mockup controls (role switcher, dark mode). Each mockup defines render().
function mockBar(name) {
  const bar = document.getElementById("mockbar");
  bar.innerHTML = `<b>${name}</b><span>View as</span><span class="seg" role="group" aria-label="View as role">${Object.keys(ROLE_LABEL).map((r) => `<button type="button" data-role="${r}" aria-pressed="${r === role}">${ROLE_LABEL[r]}</button>`).join("")}</span>
    <button type="button" class="btn-m" id="mock-dark" aria-pressed="${document.documentElement.classList.contains("dark")}">Dark mode</button>
    <span class="note">Static mockup. Nothing is saved to the server.</span>`;
  bar.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.role) {
      role = b.dataset.role;
      localStorage.setItem("nav-mock-role", role);
      bar.querySelectorAll("[data-role]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.role === role));
      const r = route(); // a role that cannot open this page is sent to the queue, as App.tsx redirects today
      if (!ITEMS.some((i) => can(i) && (r === i.route || r.startsWith(i.route + "/")))) location.hash = "#/tickets";
      render();
    } else if (b.id === "mock-dark") toggleDark();
  });
}
function toggleDark() {
  const on = document.documentElement.classList.toggle("dark");
  localStorage.setItem("nav-mock-dark", on ? "1" : "");
  document.querySelectorAll("#mock-dark,[data-dark]").forEach((x) => x.setAttribute("aria-pressed", on));
}
if (localStorage.getItem("nav-mock-dark")) document.documentElement.classList.add("dark");
// After a page change: update the title and move focus to the new page heading, so screen readers announce it.
window.addEventListener("hashchange", () => {
  render();
  document.title = `${current().label} - ${document.body.dataset.mock}`;
  const h = document.querySelector("#main h1");
  if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
});
// ---- Mockup A
ITEMS.push({ id: "admin-hub", label: "Admin", route: "/admin", roles: AD, group: "admin", icon: "grid" });
const SECTIONS = ["service", "schedule", "clients", "finance", "insights"];
// Only the sections a role works in daily start open; the rest are one click away and remembered.
const DEFAULT_OPEN = { tech: ["service", "schedule"], billing: ["finance", "insights"], read_only: ["service"], admin: ["service", "schedule", "finance"] };
const openKey = () => "nav-mock-a-open-" + role;
const openSet = () => new Set(JSON.parse(localStorage.getItem(openKey()) || "null") || DEFAULT_OPEN[role]);
const ADMIN_PAGES = [
  ["users", "Staff accounts, roles and client-portal access."],
  ["settings", "Mailbox, queues, statuses, business hours, invoicing, portal and the other lookup lists."],
  ["integrations", "RMM, accounting, Microsoft 365 and vendor connections."],
  ["automation", "Rules that triage, assign and notify."],
  ["webhooks", "Outbound events sent to other systems."],
  ["apikeys", "Keys for scripts and other tools."],
  ["audit", "Who changed what, and when."],
];

function link(it, cur, active = cur.id === it.id || topOf(cur).id === it.id, label = it.label) {
  return `<a href="#${it.route}" class="nav${active ? " on" : ""}"${active ? ' aria-current="page"' : ""}>${icon(it.icon)}<span>${esc(label)}</span>${it.id === "billing" && role !== "tech" && role !== "read_only" ? '<span class="badge" title="3 overdue invoices"><span aria-hidden="true">3</span><span class="sr-only">, 3 overdue invoices</span></span>' : ""}</a>`;
}

function sidebar(cur) {
  const g = groupOf(cur), open = openSet();
  let h = `<div class="brand"><span class="mark" aria-hidden="true">N</span>Northwind IT</div>
    <form role="search" onsubmit="event.preventDefault()"><input class="input" type="search" aria-label="Search" placeholder="Search tickets, clients, articles…"></form>
    <nav aria-label="Main"><ul><li>${link(byId("dashboard"), cur)}</li></ul>`;
  for (const s of SECTIONS) {
    const items = visibleIn(s);
    if (!items.length) continue; // a role with no pages in a section never sees its heading
    const isOpen = open.has(s);
    h += `<div class="sec"><button type="button" class="sec-h" data-sec="${s}" aria-expanded="${isOpen}" aria-controls="sec-${s}">${icon("chev", "ic chev")}<span>${groupLabel(s)}</span>${isOpen ? "" : `<span class="count" aria-label="${items.length} pages">${items.length}</span>`}</button>
      <ul id="sec-${s}"${isOpen ? "" : " hidden"}>${items.map((i) => `<li>${link(i, cur)}</li>`).join("")}</ul></div>`;
  }
  h += `<div class="sep"></div><ul><li>${role === "admin" ? link(byId("admin-hub"), cur, g === "admin") : link(byId("users"), cur)}</li></ul></nav>
    ${onCallWidget()}
    <div class="foot"><a class="link" href="#/profile" title="Your notification settings" style="color:var(--s900)">${ME[role]} <span class="muted">(${role})</span></a>
      <div class="row"><button type="button" class="link">Sign out</button><button type="button" class="link" data-dark aria-pressed="${document.documentElement.classList.contains("dark")}">Dark mode</button></div></div>`;
  return h;
}

function adminHub(cur) {
  const sub = [byId("admin-hub"), ...ADMIN_PAGES.map(([id]) => byId(id))];
  const nav = `<nav aria-label="Admin"><h2>Admin</h2><ul>${sub.map((i) => `<li>${link(i, cur, cur.id === i.id, i.id === "admin-hub" ? "Overview" : i.label)}</li>`).join("")}</ul></nav>`;
  const body = cur.id === "admin-hub"
    ? `<div class="page"><h1>Admin</h1><p class="muted" style="margin-top:-6px">Everything you set up once and change rarely. Daily work stays in the sidebar.</p><div class="hub-grid">${ADMIN_PAGES.map(([id, d]) => {
        const i = byId(id);
        return `<a class="card" href="#${i.route}"><h3>${icon(i.icon)}${i.label}</h3><span class="muted">${d}</span></a>`;
      }).join("")}</div></div>`
    : placeholderPage(cur);
  return `<div class="hub">${nav}${body}</div>`;
}

let lastRoute = null;
function render() {
  const cur = current();
  if (route() !== lastRoute && SECTIONS.includes(groupOf(cur))) { // opening a page opens its section
    lastRoute = route();
    const open = openSet();
    open.add(groupOf(cur));
    localStorage.setItem(openKey(), JSON.stringify([...open]));
  }
  document.getElementById("sidebar").innerHTML = sidebar(cur);
  document.getElementById("main").innerHTML = role === "admin" && groupOf(cur) === "admin" ? adminHub(cur) : pageFor(cur);
}

document.getElementById("sidebar").addEventListener("click", (e) => {
  const sec = e.target.closest("[data-sec]");
  if (sec) {
    const open = openSet(), s = sec.dataset.sec;
    open.has(s) ? open.delete(s) : open.add(s);
    localStorage.setItem(openKey(), JSON.stringify([...open]));
    render();
    document.querySelector(`[data-sec="${s}"]`).focus();
  } else if (e.target.closest("[data-dark]")) toggleDark();
  else if (e.target.closest("a")) closeMenu();
});
const menu = document.getElementById("menu");
const closeMenu = () => { document.getElementById("sidebar").classList.remove("open"); menu.setAttribute("aria-expanded", "false"); };
menu.addEventListener("click", () => {
  const on = document.getElementById("sidebar").classList.toggle("open");
  menu.setAttribute("aria-expanded", on);
});
mockBar("Mockup A: grouped sidebar");
render();
</script>
</body>
</html>
