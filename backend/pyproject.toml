[project]
name = "psa-backend"
version = "0.1.0"
description = "Custom PSA backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiom
