# Production-shaped stack: proxy(+static web) -> api -> db. Copy .env.example to .env first.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: psa
      POSTGRES_USER: psa_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psa_owner -d psa"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://psa_owner:${OWNER_DB_PASSWORD}@db:5432/psa
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://psa_app:${APP_DB_PASSWORD}@db:5432/psa
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. https://psa.example.com}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?}
      DEV_LOGIN_ENABLED: "false"
      ATTACHMENTS_DIR: /data/attachments
    volumes:
      - attachments:/data/attachments:ro   # the API only serves downloads; the worker writes
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # not published: only the proxy can reach the API

  worker:
    # Polls the support mailbox and sends queued customer emails. Idles (harmlessly) until the
    # GRAPH_* / MAIL_MAILBOX values in .env are filled in: see docs/MAIL_SETUP.md
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://psa_app:${APP_DB_PASSWORD}@db:5432/psa
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      MAIL_MAILBOX: ${MAIL_MAILBOX:-}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-60}
      GRAPH_BASE_URL: ${GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      GRAPH_LOGIN_URL: ${GRAPH_LOGIN_URL:-https://login.microsoftonline.com}
      ATTACHMENTS_DIR: /data/attachments
    volumes:
      - attachments:/data/attachments
    depends_on:
      migrate: { condition: service_completed_successfully }

  proxy:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  attachments:
